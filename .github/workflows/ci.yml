name: SonarCloud Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    name: Test, coverage, and analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0    # Required for Sonar blame analysis

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Build and smoke-test SSR
        env:
          NUXT_PUBLIC_API_BASE_URL: https://api.krealalejo.dev
        run: |
          pnpm build
          PORT=3999 node .output/server/index.mjs > ssr-server.log 2>&1 &
          server_pid=$!
          for attempt in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:3999/ && break
            sleep 1
          done
          failed=0
          for route in / /cv /blog /contact /projects; do
            status=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3999${route}")
            echo "${route} -> ${status}"
            [ "$status" = "200" ] || failed=1
          done
          kill "$server_pid"
          if grep -q 'request error' ssr-server.log; then
            cat ssr-server.log
            failed=1
          fi
          exit "$failed"

      - name: SonarCloud Scan
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
