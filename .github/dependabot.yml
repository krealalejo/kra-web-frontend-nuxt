version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      - dependency-name: "nuxt"
        versions: [">=4.5.0"]
      - dependency-name: "@nuxtjs/sitemap"
        versions: [">=9.0.0"]
    groups:
      npm-all:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions-all:
        patterns:
          - "*"
